# AeroSpace configuration inspired by the Fedora Sway/Hyprland workflow.
#
# macOS does not have a true Super/Mod4 key that is practical to own globally,
# so Option/Alt is used as the window-manager modifier.

config-version = 2
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 0

# Keep ten stable workspaces like the Linux configs.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

# Match the focus-follows-mouse feel used on Hyprland.
focus-follows-mouse.enabled = true

# Move the pointer only when keyboard focus crosses monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

# Applications ---------------------------------------------------------------

# i3/Sway-style terminal shortcut.
alt-enter = 'exec-and-forget open -na Ghostty'

# Alt-Space is intentionally left free for a future launcher such as Vicinae.

# Window lifecycle -----------------------------------------------------------

alt-q = 'close'
alt-f = 'fullscreen'
alt-t = 'layout floating tiling'

# Focus ----------------------------------------------------------------------

alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

alt-left = 'focus --boundaries-action wrap-around-the-workspace left'
alt-down = 'focus --boundaries-action wrap-around-the-workspace down'
alt-up = 'focus --boundaries-action wrap-around-the-workspace up'
alt-right = 'focus --boundaries-action wrap-around-the-workspace right'

# Move windows ---------------------------------------------------------------

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# Layout ---------------------------------------------------------------------

# These mirror the explicit horizontal/vertical controls from Sway.
alt-b = 'layout tiles horizontal'
alt-v = 'layout tiles vertical'

# Reset a workspace tree when a nested layout gets awkward.
alt-shift-r = 'flatten-workspace-tree'

# Workspaces -----------------------------------------------------------------

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 0'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Resize mode ---------------------------------------------------------------

alt-r = 'mode resize'

# Service mode --------------------------------------------------------------

alt-shift-semicolon = 'mode service'

[mode.resize.binding]

h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'

enter = 'mode main'
esc = 'mode main'

[mode.service.binding]

esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Application routing -------------------------------------------------------
#
# Keep this intentionally small. Rules should only exist where the workspace
# assignment is stable enough to be part of the workstation model.

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
run = 'move-node-to-workspace 8'

# Generic utility/dialog-style windows can opt into floating by title.
[[on-window-detected]]
if.window-title-regex-substring = 'floating'
run = 'layout floating'
