# Keep ALSA output nodes awake.
#
# This is retained from the previous setup because suspend/resume can cause
# audible delays or missed first sounds on some desktop audio devices.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
