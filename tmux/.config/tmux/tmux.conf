# Shared tmux configuration for Fedora Linux and macOS.

# Prefix ----------------------------------------------------------------------

# C-a is easier to reach than the default C-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload the configuration with <prefix> r.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Windows and panes -----------------------------------------------------------

# Human-friendly numbering and automatic cleanup after closing windows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Interaction -----------------------------------------------------------------

set -g mouse on

# Reduce the delay after pressing Escape. This matters for terminal Neovim.
set -s escape-time 10

# Keep more scrollback without making the configuration excessive.
set -g history-limit 50000

# Terminal capabilities -------------------------------------------------------

# Keep tmux's own TERM stable and advertise modern terminal capabilities.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:hyperlinks"

# Allow applications such as terminal Neovim to pass supported escape
# sequences through tmux.
set -g allow-passthrough on

# Clipboard -------------------------------------------------------------------

# Use the platform clipboard when a suitable command is available.
#
# macOS: pbcopy is part of the operating system.
# Wayland: wl-copy is provided by wl-clipboard.
if-shell -b 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"'

if-shell -b 'command -v wl-copy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"'

# Status ----------------------------------------------------------------------

set -g status-position top
set -g status-interval 5

# Keep the initial status line intentionally simple. A theme can be added later
# without making it part of the bootstrap or plugin installation mechanism.
set -g status-left ' #S '
set -g status-right ' %Y-%m-%d %H:%M '
