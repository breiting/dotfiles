# Shared tmux configuration for Fedora Linux and macOS.

# Prefix ----------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload the configuration with <prefix> r.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Windows and panes -----------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Interaction -----------------------------------------------------------------

set -g mouse on
set -s escape-time 10
set -g history-limit 50000

# Terminal capabilities -------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:hyperlinks"
set -g allow-passthrough on

# Clipboard -------------------------------------------------------------------

if-shell -b 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"'

if-shell -b 'command -v wl-copy >/dev/null 2>&1' \
    'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"'

# Plugins ---------------------------------------------------------------------

# TPM uses ~/.config/tmux/plugins when the tmux config itself lives below XDG.
set -g @plugin 'tmux-plugins/tpm'

# Seamless Ctrl-h/j/k/l navigation between tmux panes and Neovim splits.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Dracula theme
set -g @plugin 'dracula/tmux'

# Config dracula theme
set -g @dracula-show-powerline true
set -g @dracula-time-format "%H:%M"
set -g @dracula-plugins "time battery"
set -g @dracula-fixed-location "Graz"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-fahrenheit false
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
set -g status-position top

# TPM must be initialized at the very bottom of this file.
run '~/.config/tmux/plugins/tpm/tpm'
